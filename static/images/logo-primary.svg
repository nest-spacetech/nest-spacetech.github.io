  <!-- Node: the controlled setpoint / sensor bead / satellite -->
  <circle cx="144.43" cy="218.0" r="13" fill="#FFA34D"/>
  <circle cx="140.7" cy="214" r="4.5" fill="#FFDCA8"/>

  <text x="270" y="150" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="100" font-weight="700" fill="#16213E" letter-spacing="1">NEST</text>
  <text x="272" y="184" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6478" letter-spacing="2">NIRMALA EVOLUTIONARY SPACE TECH LLP</text>
</svg>
