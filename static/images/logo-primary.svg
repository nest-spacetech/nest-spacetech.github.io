<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NEST — Nirmala Evolutionary Space Tech LLP</title>
  <defs>
    <linearGradient id="nestArcGradient" x1="51" y1="190" x2="149" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E3A87"/>
      <stop offset="100%" stop-color="#E8892E"/>
    </linearGradient>
  </defs>

  <!-- Orbital arc: an open ring, cool (space) to warm (thermal control) -->
  <path d="M 148.73,198.93 A 84,84 0 1 0 51.19,168.18"
