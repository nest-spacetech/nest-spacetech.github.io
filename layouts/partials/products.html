<section class="products" id="products">
    <div class="container">
        <h2>What We Make</h2>
        <div class="products-grid">
            {{ range .Site.Data.products }}
            <div class="product-card">
                <div class="product-header">
                    <h3>{{ .name }}</h3>
                    <span class="badge" style="background-color: {{ .status_color }}; color: {{ if eq .status_color "#FFA34D" }}#16213E{{ else }}#FFFFFF{{ end }};">{{ .status }}</span>
                </div>
                <table class="spec-table">
                    {{ range .specs }}
                    <tr>
                        <td class="spec-label">{{ .label }}</td>
                        <td>{{ .value }}</td>
                    </tr>
                    {{ end }}
                </table>
            </div>
            {{ end }}
        </div>
        <p style="text-align: center; margin-top: 40px; color: #D1D5DB; font-family: var(--font-mono); font-size: 0.95rem;">
            Target Applications: Satellite thermal control · Launch vehicle propulsion monitoring · Cryogenic instruments · Defence electronics
        </p>
    </div>
</section>
