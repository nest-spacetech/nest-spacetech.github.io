<section class="contact" id="contact">
    <div class="container">
        <h2 style="font-size: 2.5rem; margin-bottom: 48px; text-align: center;">Get in Touch</h2>
        <div class="contact-grid">
            <div class="contact-form">
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" class="form-control">
                            <option>Product Enquiry</option>
                            <option>Partnership</option>
                            <option>Investor/Grant</option>
                            <option>General</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; border: none; font-size: 1.1rem; cursor: pointer;">Send Message →</button>
                </form>
            </div>
            <div class="contact-details">
                <h3>Contact Details</h3>
                <p><strong>Puneeth Shankar</strong><br>Designated Partner, NEST LLP</p>
                <p>📧 puneeth.nest@gmail.com</p>
                <p style="margin-top: 32px;"><strong>Registered Address</strong><br>
                304, 6th A Cross, BSK 1st Stage, 2nd Block,<br>
                Banashankari, Bangalore - 560050,<br>
                Karnataka, India</p>
            </div>
        </div>
    </div>
</section>
